name: family-app

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://family_app:${POSTGRES_PASSWORD}@db:5432/family_app?schema=public
      SESSION_COOKIE_NAME: family_app_session
      APP_URL: ${APP_URL}
      EXPENSE_EXCEL_DIR: ${EXPENSE_EXCEL_DIR:-/data/expenses}
      MILEAGE_EXCEL_DIR: ${MILEAGE_EXCEL_DIR:-/data/mileage}
      DOCUMENTS_DIR: ${DOCUMENTS_DIR:-/mnt/documents}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ${EXPENSE_EXCEL_HOST_DIR:-/volume1/docker/family-app/expenses}:/data/expenses
      - ${MILEAGE_EXCEL_HOST_DIR:-/volume1/docker/family-app/mileage}:/data/mileage
      - ${DOCUMENTS_HOST_DIR:-/volume1/docker/family-app/documents}:/mnt/documents:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const os=require('os');const urls=['http://127.0.0.1:3000/api/health','http://'+os.hostname()+':3000/api/health'];(async()=>{for(const url of urls){try{const res=await fetch(url);if((await res.text()).trim()==='ok')process.exit(0)}catch{}}process.exit(1)})()\""]
      interval: 5m
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: family_app
      POSTGRES_USER: family_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - family_app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_app -d family_app"]
      interval: 60s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    image: postgres:16.4-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: family_app
      POSTGRES_USER: family_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_TIME: ${BACKUP_TIME:-01:00}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ${BACKUP_DIR:-/volume1/docker/family-app/backups}:/backups
    command: ["sh", "/usr/local/bin/backup-postgres.sh"]
    restart: unless-stopped

volumes:
  family_app_postgres:
